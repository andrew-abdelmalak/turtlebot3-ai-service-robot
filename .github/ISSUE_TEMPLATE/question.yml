name: Question
description: Ask about setup, PDDL planning, or Gazebo simulation
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to run or understand?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker or ROS 2 Humble setup
      placeholder: Ubuntu 22.04 / Python 3.12 / Docker
