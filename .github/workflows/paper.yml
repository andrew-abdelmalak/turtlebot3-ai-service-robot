name: Paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

concurrency:
  group: paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: Build paper PDF (pdfLaTeX, TeX Live 2025)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile IEEE paper with TeX Live 2025
        run: |
          docker run --rm --network=none \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/paper:/work" \
            -w /work \
            texlive/texlive:TL2025-historic@sha256:7056390eac37715fd3e01875037ceb4016cb17d44c611f7bbbfa7a012007979f \
            latexmk -pdf -no-shell-escape -interaction=nonstopmode -halt-on-error AI_Robotics_Planning.tex

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-pdf
          path: paper/AI_Robotics_Planning.pdf
          if-no-files-found: error
