  <line x1="160" y1="315" x2="160" y2="145" stroke="#1d4ed8" stroke-width="3"/><line x1="160" y1="145" x2="410" y2="230" stroke="#1d4ed8" stroke-width="3"/><line x1="410" y1="230" x2="650" y2="230" stroke="#1d4ed8" stroke-width="3"/><line x1="650" y1="230" x2="650" y2="82" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/><line x1="650" y1="230" x2="855" y2="315" stroke="#1d4ed8" stroke-width="3"/>
