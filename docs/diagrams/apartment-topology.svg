afc" stroke="#cbd5e1" stroke-width="1.8"/><text x="650" y="216" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="700" fill="#0f172a">diningroom</text><text x="650" y="234" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#475569">(6.0, 1.0) m</text><text x="650" y="252" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#475569">plate, notebook</text><rect x="555" y="45" width="190" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="650" y="68" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="700" fill="#0f172a">bathroom</text><text x="650" y="86" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#475569">(3.0, 5.0) m</text><text x="650" y="104" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#475569">towel</text><rect x="760" y="278" width="190" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="855" y="301" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="700" fill="#0f172a">kitchen</text><text x="855" y="319" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#475569">(8.5, -1.5) m</text><text x="855" y="337" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#1d4ed8">cup (pick), pan</text>

  <!-- Benchmark footer strip -->
  <rect x="32" y="370" width="916" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="48" y="395" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#0f172a">8-step optimal plan (5 rooms): 1-2 move livingroom-&gt;diningroom-&gt;kitchen | 3 pick cup | 4-7 move kitchen-&gt;diningroom-&gt;livingroom-&gt;bedroom-&gt;storage | 8 place cup</text>
