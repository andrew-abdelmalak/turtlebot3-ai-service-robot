<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="980" height="390" role="img" aria-label="Three-layer closed-loop system architecture from PDDL task planning to ROS 2 execution">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-ok-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-warn-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3b341"/>
    </marker>
  </defs>

  <rect width="980" height="390" rx="12" fill="#0d1117"/>

  <!-- Column headers -->
  <text x="160" y="34" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="700" fill="#8b949e">1. SYMBOLIC PLANNING</text>
  <text x="490" y="34" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="700" fill="#8b949e">2. CLOSED-LOOP BRIDGE</text>
  <text x="815" y="34" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="700" fill="#8b949e">3. ROS 2 &amp; GAZEBO</text>

  <!-- Layer 1: Planning -->
  <rect x="30" y="54" width="260" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="160" y="81" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">Goal CLI &amp; Validator</text>
  <text x="160" y="102" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#8b949e">cli.py (at / robot-at / holding)</text>

  <rect x="30" y="152" width="260" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="160" y="179" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">PDDL Generator</text>
  <text x="160" y="200" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#8b949e">domain.pddl + problem.pddl</text>

  <rect x="30" y="250" width="260" height="72" rx="10" fill="#13233a" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="160" y="279" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">Fast Downward Planner</text>
  <text x="160" y="301" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#58a6ff">A* search + LM-Cut heuristic</text>

  <!-- Layer 2: Bridge -->
  <rect x="360" y="54" width="260" height="82" rx="10" fill="#0f2922" stroke="#3fb950" stroke-width="1.8"/>
  <text x="490" y="83" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">Knowledge Base (KB)</text>
  <text x="490" y="104" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#3fb950">kb.py + world_model.py</text>
  <text x="490" y="122" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#8b949e">6 rooms, 10 objects, robot state</text>

  <rect x="360" y="200" width="260" height="86" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="490" y="229" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">Plan Executor</text>
  <text x="490" y="250" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#8b949e">executor.py (move / pick / place)</text>
  <text x="490" y="270" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#8b949e">Checks ROS 2 exit code per step</text>

  <rect x="360" y="314" width="260" height="44" rx="8" fill="#2b1d12" stroke="#d29922" stroke-width="1.4"/>
  <text x="490" y="340" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="600" fill="#e3b341">Exit != 0: abort plan, keep true KB</text>

  <!-- Layer 3: ROS 2 -->
  <rect x="680" y="54" width="270" height="82" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="815" y="82" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">Navigation Node</text>
  <text x="815" y="103" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#58a6ff">/navigate_to_pose (Nav2)</text>
  <text x="815" y="122" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#8b949e">0.30 m distance tolerance</text>

  <rect x="680" y="160" width="270" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="815" y="187" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">Gripper Node</text>
  <text x="815" y="208" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#58a6ff">/arm_controller/follow_joint_trajectory</text>
  <text x="815" y="226" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#58a6ff">/gripper_controller/gripper_cmd</text>
  <text x="815" y="242" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#8b949e">Approach -&gt; Actuate -&gt; Home pose</text>

  <rect x="680" y="278" width="270" height="78" rx="10" fill="#13233a" stroke="#30363d" stroke-width="1.5"/>
  <text x="815" y="306" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="15" font-weight="700" fill="#f0f6fc">Gazebo House Simulation</text>
  <text x="815" y="327" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#8b949e">my_house.world + map.yaml</text>
  <text x="815" y="344" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#8b949e">TurtleBot3 + OpenManipulator</text>

  <!-- Arrows -->
  <line x1="160" y1="120" x2="160" y2="146" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="160" y1="218" x2="160" y2="244" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- KB -> PDDL Generator -->
  <path d="M 360 95 L 325 95 L 325 185 L 296 185" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-ok-dark)"/>
  <text x="325" y="144" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="10.5" fill="#3fb950">:init</text>

  <!-- Planner -> Executor -->
  <path d="M 290 286 L 325 286 L 325 243 L 354 243" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Executor -> ROS 2 nodes -->
  <path d="M 620 225 L 650 225 L 650 95 L 674 95" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <path d="M 620 245 L 650 245 L 650 206 L 674 206" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- ROS 2 nodes -> Gazebo -->
  <line x1="815" y1="252" x2="815" y2="272" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <!-- Closed-loop confirmation back to KB -->
  <line x1="490" y1="200" x2="490" y2="142" stroke="#3fb950" stroke-width="2.2" marker-end="url(#arrow-ok-dark)"/>
  <rect x="424" y="158" width="132" height="22" rx="4" fill="#0d1117"/>
  <text x="490" y="173" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="600" fill="#3fb950">Update KB on exit 0</text>

  <!-- Failure arrow -->
  <line x1="490" y1="286" x2="490" y2="308" stroke="#e3b341" stroke-width="1.8" marker-end="url(#arrow-warn-dark)"/>
</svg>
