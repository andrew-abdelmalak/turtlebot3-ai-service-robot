b22" stroke="#30363d" stroke-width="1.8"/><text x="650" y="216" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="700" fill="#f0f6fc">diningroom</text><text x="650" y="234" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#8b949e">(6.0, 1.0) m</text><text x="650" y="252" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#8b949e">plate, notebook</text><rect x="555" y="45" width="190" height="74" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/><text x="650" y="68" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="700" fill="#f0f6fc">bathroom</text><text x="650" y="86" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#8b949e">(3.0, 5.0) m</text><text x="650" y="104" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#8b949e">towel</text><rect x="760" y="278" width="190" height="74" rx="10" fill="#13233a" stroke="#58a6ff" stroke-width="1.8"/><text x="855" y="301" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="700" fill="#f0f6fc">kitchen</text><text x="855" y="319" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#8b949e">(8.5, -1.5) m</text><text x="855" y="337" text-anchor="middle" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" fill="#58a6ff">cup (pick), pan</text>

  <!-- Benchmark footer strip -->
  <rect x="32" y="370" width="916" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="48" y="395" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#f0f6fc">8-step optimal plan (5 rooms): 1-2 move livingroom-&gt;diningroom-&gt;kitchen | 3 pick cup | 4-7 move kitchen-&gt;diningroom-&gt;livingroom-&gt;bedroom-&gt;storage | 8 place cup</text>
